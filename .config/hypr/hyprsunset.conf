# Auto blue-light filter driven by Seattle sunrise/sunset.
# hyprsunset computes the transition times from the coordinates below.

max-gamma = 150

latitude = 47.61
longitude = -122.33

# Daytime: slight warmth (identity/6500K was too harsh)
profile {
    sunrise = true
    temperature = 5700
}

# Nighttime: warm filter (matches `omarchy toggle nightlight`)
profile {
    sunset = true
    temperature = 4000
}
